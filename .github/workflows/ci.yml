# The gate: the full Horde test suite (skills/horde/scripts/tests/*.test.mjs), on every push and
# PR, against a real Yggdrasil build linked onto PATH. Horde requires Yggdrasil at runtime, and the
# suite refuses to fake it: requireYg() in tests/helpers.mjs throws rather than skip when it can't
# find one.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: tests (node ${{ matrix.node }})
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: git identity for test fixtures
        run: |
          git config --global user.name ci
          git config --global user.email ci@invalid
          git config --global init.defaultBranch main
      # Yggdrasil defaults to its own main below. When this workflow run is itself on a branch
      # that also exists on Yggdrasil — the two repos moving together for a joint release — the
      # suite should build against that branch, not silently fall back to main while the two are
      # still mid-release. Once a release merges and the branch is gone, this resolves to main —
      # exactly the build every adopter gets.
      - name: resolve Yggdrasil branch
        id: yggdrasil-branch
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads "https://github.com/krzysztofdudek/Yggdrasil.git" "$branch" >/dev/null 2>&1; then
            echo "ref=${branch}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - name: checkout Yggdrasil
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/Yggdrasil
          ref: ${{ steps.yggdrasil-branch.outputs.ref }}
          path: yggdrasil
      - name: build and link Yggdrasil's CLI
        working-directory: yggdrasil/source/cli
        run: |
          npm install
          npm run build
          npm link
      - name: checkout RatatoskrSkill
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/RatatoskrSkill
          # RatatoskrSkill keeps its own version, outside this family's joint releases, so no
          # branch-matching is needed here — checkout takes its default branch. The drift test
          # (tests/ratatoskr-product-language-drift.test.mjs) only reads two text files off this
          # checkout; no build or install step is needed.
          path: ratatoskr
      # Horde requires Grain (the architect measures with it), and so does the suite: requireGrain() in
      # tests/helpers.mjs throws rather than skip. Grain moves with this repository in a joint release,
      # so the Grain branch of the same name is checked out beside it: a pull request tries its head
      # branch, then the branch it targets, and otherwise Grain's main. Grain runs with nothing to
      # install: its parser runtime, grammars and Runes are vendored.
      - name: resolve Grain branch
        id: grain-branch
        run: |
          found="main"
          for branch in "${{ github.head_ref || github.ref_name }}" "${{ github.base_ref }}"; do
            [ -n "$branch" ] || continue
            if git ls-remote --exit-code --heads "https://github.com/krzysztofdudek/Grain.git" "$branch" >/dev/null 2>&1; then
              found="$branch"
              break
            fi
          done
          echo "ref=${found}" >> "$GITHUB_OUTPUT"
      - name: checkout Grain
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/Grain
          ref: ${{ steps.grain-branch.outputs.ref }}
          path: grain
      # A mission's record is a Jarl loop, written through Jarl's record module vendored under
      # skills/horde/scripts/vendor (vendor.mjs). Jarl moves with this repository in a joint
      # release, so the Jarl branch of the same name is checked out beside it, the way Yggdrasil is
      # above: a pull request tries its head branch, then the branch it targets. With neither on Jarl
      # (a feature branch pushed on its own, or main once the release branches are deleted) it checks
      # out the commit the pin names, never Jarl's main: the copy is held to what it was taken from, and
      # a Jarl change reaches this repository only through a pin moved in a commit here.
      - name: resolve Jarl branch
        id: jarl-branch
        run: |
          found=""
          for branch in "${{ github.head_ref || github.ref_name }}" "${{ github.base_ref }}"; do
            [ -n "$branch" ] || continue
            if git ls-remote --exit-code --heads "https://github.com/krzysztofdudek/JarlSkill.git" "$branch" >/dev/null 2>&1; then
              found="$branch"
              break
            fi
          done
          [ -n "$found" ] || found="$(node -p "require('./skills/horde/scripts/vendor/jarl.pin.json').commit")"
          echo "ref=${found}" >> "$GITHUB_OUTPUT"
      - name: checkout JarlSkill
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/JarlSkill
          ref: ${{ steps.jarl-branch.outputs.ref }}
          path: jarl
      # The vendored record, byte for byte against that branch: a Jarl change the copy does not carry
      # is red here until it is vendored (node vendor.mjs update --source <JarlSkill>).
      - name: jarl vendor gate
        working-directory: skills/horde/scripts
        run: node vendor.mjs check --source ${{ github.workspace }}/jarl
      - name: run suite
        working-directory: skills/horde/scripts
        env:
          HORDE_TEST_RATATOSKR_DIR: ${{ github.workspace }}/ratatoskr
          HORDE_TEST_JARL: ${{ github.workspace }}/jarl/skills/jarl/scripts/jarl.mjs
          HORDE_TEST_GRAIN: node ${{ github.workspace }}/grain/plugins/grain/bin/grain.mjs
        run: |
          node vendor.mjs check
          node tests/yg-floor.mjs
          node --test tests/*.test.mjs

  # The same suite on Windows. Horde's tools start programs through npm's .cmd shims, run gate
  # commands through Git for Windows' sh, stop process trees with taskkill and compare the paths git
  # prints with forward slashes — none of which the Linux job ever exercises. Same checkout of
  # Yggdrasil, same suite command; bash is the step shell so the steps read as they do above.
  #
  # One step differs: Yggdrasil's CLI is built on Linux (the job below) and only installed and linked
  # on Windows. Yggdrasil's build compiles a tree-sitter grammar and checks it against a pinned
  # sha256, and on Windows that build does not yet reproduce the pinned bytes, so the build stops.
  # What it produces (dist/: a JavaScript bundle and wasm grammars) is the same on every OS, so
  # building it once on Linux tests Horde against exactly the CLI a Windows user installs.
  yggdrasil-dist:
    runs-on: ubuntu-latest
    name: build Yggdrasil for windows
    timeout-minutes: 15
    outputs:
      ref: ${{ steps.yggdrasil-branch.outputs.ref }}
    steps:
      - name: resolve Yggdrasil branch
        id: yggdrasil-branch
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads "https://github.com/krzysztofdudek/Yggdrasil.git" "$branch" >/dev/null 2>&1; then
            echo "ref=${branch}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - name: checkout Yggdrasil
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/Yggdrasil
          ref: ${{ steps.yggdrasil-branch.outputs.ref }}
          path: yggdrasil
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build Yggdrasil's CLI
        working-directory: yggdrasil/source/cli
        run: |
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-dist
          path: yggdrasil/source/cli/dist
          retention-days: 1

  test-windows:
    needs: yggdrasil-dist
    runs-on: windows-latest
    name: tests (windows, node 24)
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The runner's git converts line endings on checkout (core.autocrlf=true); the fixtures the suite
      # builds compare file bytes, as the Linux job does.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: git identity for test fixtures
        run: |
          git config --global user.name ci
          git config --global user.email ci@invalid
          git config --global init.defaultBranch main
      - name: checkout Yggdrasil
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/Yggdrasil
          ref: ${{ needs.yggdrasil-dist.outputs.ref }}
          path: yggdrasil
      - uses: actions/download-artifact@v4
        with:
          name: yggdrasil-dist
          path: yggdrasil/source/cli/dist
      - name: install and link Yggdrasil's CLI
        working-directory: yggdrasil/source/cli
        run: |
          npm install
          npm link
      - name: checkout RatatoskrSkill
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/RatatoskrSkill
          path: ratatoskr
      # Horde requires Grain (the architect measures with it), and so does the suite: requireGrain() in
      # tests/helpers.mjs throws rather than skip. Grain moves with this repository in a joint release,
      # so the Grain branch of the same name is checked out beside it: a pull request tries its head
      # branch, then the branch it targets, and otherwise Grain's main. Grain runs with nothing to
      # install: its parser runtime, grammars and Runes are vendored.
      - name: resolve Grain branch
        id: grain-branch
        run: |
          found="main"
          for branch in "${{ github.head_ref || github.ref_name }}" "${{ github.base_ref }}"; do
            [ -n "$branch" ] || continue
            if git ls-remote --exit-code --heads "https://github.com/krzysztofdudek/Grain.git" "$branch" >/dev/null 2>&1; then
              found="$branch"
              break
            fi
          done
          echo "ref=${found}" >> "$GITHUB_OUTPUT"
      - name: checkout Grain
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/Grain
          ref: ${{ steps.grain-branch.outputs.ref }}
          path: grain
      # The runner's temp directory is a short 8.3 name (C:\Users\RUNNER~1\…) that git prints long,
      # and the suite compares the two spellings in many places; the job's own temp directory has
      # only the one.
      - name: run suite
        working-directory: skills/horde/scripts
        env:
          HORDE_TEST_RATATOSKR_DIR: ${{ github.workspace }}/ratatoskr
          HORDE_TEST_GRAIN: node ${{ github.workspace }}/grain/plugins/grain/bin/grain.mjs
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          node vendor.mjs check
          node tests/yg-floor.mjs
          node --test tests/*.test.mjs

  # This repository also publishes law: `packages/promises`, offered to a repository that has no
  # evidence layer of its own. Publishing runs somebody else's code in somebody else's repository,
  # so the pre-publish check runs here on every push — once, not per Node version, because it reads
  # the package files and never executes a rule.
  marketplace:
    runs-on: ubuntu-latest
    name: marketplace
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: resolve Yggdrasil branch
        id: yggdrasil-branch
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads "https://github.com/krzysztofdudek/Yggdrasil.git" "$branch" >/dev/null 2>&1; then
            echo "ref=${branch}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - name: checkout Yggdrasil
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/Yggdrasil
          ref: ${{ steps.yggdrasil-branch.outputs.ref }}
          path: yggdrasil
      - name: build and link Yggdrasil's CLI
        working-directory: yggdrasil/source/cli
        run: |
          npm install
          npm run build
          npm link
      - name: check what this repository publishes
        run: yg marketplace check
