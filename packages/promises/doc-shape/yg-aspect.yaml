name: PromiseHasItsShape
description: A promise is one file with a frontmatter id matching its filename, a status of implemented or one of this repository's own parked markers, exactly the sections this repository asks for, and — where it names them at all — a class of proof that is an e2e scenario, a hermetic test, a mutation, a recorded stub, an artifact or client testimony, reproduced by a gate, a guard, a worker or the client.
reviewer:
  type: deterministic
status: enforced
errs: exact
# Promises are markdown; the suite that keeps them is not. This rule is about the
# promise document, so a repository may map it onto a component that also carries
# the suite without every test file being read as a malformed promise. The glob is
# depth-relative on purpose: a package cannot know where a repository keeps things.
scope:
  per: node
  files:
    path: "**/*.md"
